<h2>登入 Personal Feed</h2>
<p>在電腦或 Safari 裡，點下面的連結就能登入：</p>
<p><a href="{{ .ConfirmationURL }}">登入 Personal Feed</a></p>
<p>如果你是從 iPhone 主畫面的 App 登入，請在登入頁輸入這組驗證碼：</p>
<p style="font-size: 28px; font-weight: 600; letter-spacing: 6px; font-family: monospace;">{{ .Token }}</p>
<p>連結和驗證碼在 1 小時內有效，只能使用一次。如果不是你本人要求登入，可以忽略這封信。</p>
