name: Scheduled jobs

# Ingestion, the Daily Digest and the weekly review run here instead of on the
# web host: GitHub Actions is free for public repositories and has no short
# function time limit, and the regular writes keep the free Supabase project
# active.
#
# They are started by the personal-feed-scheduler Cloudflare Worker
# (scheduler/), whose hourly cron calls workflow_dispatch. GitHub's own
# `schedule` events were delayed by hours or skipped, so none are used here.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [ingest, digest, weekly]
        default: ingest

# Runs queue instead of overlapping, so a digest dispatched right after an
# ingest waits for it and sees its stories.
concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_FAST: ${{ vars.GEMINI_MODEL_FAST || 'gemini-3.1-flash-lite' }}
      GEMINI_MODEL_QUALITY: ${{ vars.GEMINI_MODEL_QUALITY || 'gemini-3.5-flash-lite' }}
      GEMINI_MIN_INTERVAL_MS: ${{ vars.GEMINI_MIN_INTERVAL_MS || '5000' }}
      APP_URL: ${{ vars.APP_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Ingest sources
        if: inputs.job == 'ingest'
        run: npm run job:ingest

      - name: Generate Daily Digest
        if: inputs.job == 'digest'
        run: npm run job:digest

      - name: Generate weekly review
        if: inputs.job == 'weekly'
        run: npm run job:weekly
